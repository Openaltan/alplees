    <text x="3" y="150" fill="#c9c9d6" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22">Sesle yazma, profesyonel dikte ve akıllı asistan</text>
    <rect x="3" y="184" width="168" height="34" rx="17" fill="#1c1c28" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="25" cy="201" r="5" fill="#ff7a3d"/>
    <text x="40" y="207" fill="#ffd9b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="600">Windows release</text>
    <rect x="188" y="184" width="156" height="34" rx="17" fill="#1c1c28" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="210" cy="201" r="5" fill="#4ade80"/>
    <text x="225" y="207" fill="#d8ffe6" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="600">Yerel Whisper</text>
  </g>

  <g transform="translate(650 124)">
