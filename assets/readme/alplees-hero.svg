    <rect width="64" height="64" rx="18" fill="url(#accent)"/>
    <text x="32" y="42" text-anchor="middle" fill="#1a1208" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="32" font-weight="800">A</text>
