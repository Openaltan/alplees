    <path d="M70 142H1130" stroke="#ffffff" stroke-opacity="0.04"/>
    <path d="M70 212H1130" stroke="#ffffff" stroke-opacity="0.035"/>
    <path d="M70 282H1130" stroke="#ffffff" stroke-opacity="0.03"/>
    <path d="M70 352H1130" stroke="#ffffff" stroke-opacity="0.025"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="60" y="44" width="1080" height="332" rx="20" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="60" y="44" width="1080" height="48" rx="20" fill="#14141c"/>
    <path d="M60 92H1140" stroke="#ffffff" stroke-opacity="0.08"/>
