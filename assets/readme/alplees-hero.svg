    <rect x="18" y="18" width="116" height="170" rx="12" fill="#0f0f16" stroke="#ffffff" stroke-opacity="0.07"/>
    <rect x="36" y="36" width="36" height="36" rx="10" fill="url(#accent)"/>
    <text x="54" y="60" text-anchor="middle" fill="#1a1208" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="800">A</text>
    <rect x="36" y="92" width="74" height="10" rx="5" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="36" y="116" width="82" height="10" rx="5" fill="#ff7a3d" fill-opacity="0.75"/>
    <rect x="36" y="140" width="58" height="10" rx="5" fill="#ffffff" fill-opacity="0.18"/>

    <rect x="154" y="18" width="248" height="72" rx="12" fill="#1c1c28" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="176" y="46" fill="#f3f3f7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="700">Profesyonel Dikte</text>
    <text x="176" y="70" fill="#9a9aae" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">Konuşma dilini yazılı metne dönüştürür</text>

    <rect x="154" y="108" width="248" height="80" rx="12" fill="#0f0f16" stroke="#ffffff" stroke-opacity="0.08"/>
    <g transform="translate(178 143)">
      <rect x="0" y="16" width="7" height="18" rx="3.5" fill="#ff7a3d" opacity="0.45"/>
      <rect x="17" y="4" width="7" height="42" rx="3.5" fill="#ff7a3d" opacity="0.78"/>
      <rect x="34" y="12" width="7" height="26" rx="3.5" fill="#ffb066" opacity="0.92"/>
      <rect x="51" y="0" width="7" height="50" rx="3.5" fill="#ff7a3d"/>
      <rect x="68" y="10" width="7" height="30" rx="3.5" fill="#ffb066" opacity="0.90"/>
      <rect x="85" y="18" width="7" height="15" rx="3.5" fill="#ff7a3d" opacity="0.55"/>
      <rect x="102" y="8" width="7" height="34" rx="3.5" fill="#ffb066" opacity="0.82"/>
      <rect x="119" y="15" width="7" height="20" rx="3.5" fill="#ff7a3d" opacity="0.55"/>
      <rect x="136" y="5" width="7" height="40" rx="3.5" fill="#ffb066" opacity="0.85"/>
      <rect x="153" y="19" width="7" height="13" rx="3.5" fill="#ff7a3d" opacity="0.45"/>
    </g>
    <rect x="326" y="130" width="42" height="20" rx="10" fill="url(#accent)"/>
    <text x="347" y="140" text-anchor="middle" dominant-baseline="middle" fill="#1a1208" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="0.4">ON</text>
