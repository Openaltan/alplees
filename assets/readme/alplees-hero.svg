  <g opacity="0.8" filter="url(#soft)">
    <path d="M1017 68C1098 92 1139 147 1147 234" stroke="#ff7a3d" stroke-opacity="0.16" stroke-width="10" stroke-linecap="round"/>
    <path d="M58 336C133 379 229 387 329 353" stroke="#ffb066" stroke-opacity="0.10" stroke-width="12" stroke-linecap="round"/>
