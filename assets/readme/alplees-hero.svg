<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Alplees</title>
  <desc id="desc">Alplees için koyu temalı, turuncu vurgulu README tanıtım görseli.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a3d"/>
      <stop offset="1" stop-color="#ffb066"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14141c"/>
      <stop offset="1" stop-color="#0b0b10"/>
    </linearGradient>
    <radialGradient id="glow-a" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(290 64) rotate(70) scale(360 520)">
      <stop stop-color="#ff7a3d" stop-opacity="0.28"/>
      <stop offset="0.58" stop-color="#ff7a3d" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-b" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1040 360) rotate(-140) scale(420 300)">
      <stop stop-color="#ffb066" stop-opacity="0.20"/>
      <stop offset="0.7" stop-color="#ffb066" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffb066" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30" y="-30" width="1260" height="500" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="34" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="soft" x="-40" y="-40" width="1280" height="500" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="#0b0b10"/>
  <rect width="1200" height="420" rx="28" fill="url(#glow-a)"/>
  <rect width="1200" height="420" rx="28" fill="url(#glow-b)"/>

  <g opacity="0.45">
